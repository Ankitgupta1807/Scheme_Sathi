<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Scheme Sathi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        body {
            background-color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 32px 28px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        .brand {
            text-align: center;
            margin-bottom: 24px;
        }
        .brand h2 {
            font-size: 24px;
            color: #1e293b;
        }
        .brand span {
            color: #ff671f;
        }
        .brand p {
            font-size: 14px;
            color: #64748b;
            margin-top: 4px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #2563eb;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .btn-submit:hover {
            background-color: #1d4ed8;
        }
        .alert {
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 16px;
            display: none;
        }
        .alert.error {
            background-color: #fee2e2;
            color: #dc2626;
            display: block;
        }
        .alert.success {
            background-color: #dcfce7;
            color: #16a34a;
            display: block;
        }
        .switch-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #64748b;
        }
        .switch-link a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }
        .switch-link a:hover {
            text-decoration: underline;
        }
        .home-link {
            display: block;
            text-align: center;
            margin-top: 14px;
            font-size: 13px;
            color: #94a3b8;
            text-decoration: none;
        }
        .home-link:hover {
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="brand">
            <h2>🏛️ Scheme<span>Sathi</span></h2>
            <p>Create a new account</p>
        </div>

        <div id="alertBox" class="alert"></div>

        <form id="registerForm" onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a password (min 6 chars)" minlength="6" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
            </div>

            <button type="submit" class="btn-submit">Register</button>
        </form>

        <div class="switch-link">
            Already have an account? <a href="login.html">Login here</a>
        </div>
        <a href="index.html" class="home-link">← Back to Portal</a>
    </div>

    <script>
        function handleRegister(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Password match check
            if (password !== confirmPassword) {
                alertBox.className = 'alert error';
                alertBox.textContent = 'Passwords do not match!';
                return;
            }

            // Get existing users from localStorage
            let users = JSON.parse(localStorage.getItem('scheme_sathi_users')) || [];

            // Check if user already exists
            if (users.some(u => u.email.toLowerCase() === email)) {
                alertBox.className = 'alert error';
                alertBox.textContent = 'An account with this email already exists.';
                return;
            }

            // Create new user object
            const newUser = {
                name: name,
                email: email,
                password: password,
                role: 'Citizen',
                avatarColor: '#2563eb'
            };

            // Save to localStorage users array
            users.push(newUser);
            localStorage.setItem('scheme_sathi_users', JSON.stringify(users));

            // Also automatically log in the new user
            localStorage.setItem('scheme_sathi_current_user', JSON.stringify(newUser));

            alertBox.className = 'alert success';
            alertBox.textContent = 'Registration successful! Taking you to the portal...';

            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        }
    </script>

</body>
</html>
