# Application configuration (development)
# Copy to src/main/resources/application.yml and adjust values.

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/scheme_sathi?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME:your_db_user}
    password: ${DB_PASSWORD:your_db_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

server:
  port: 8080
  servlet:
    session:
      cookie:
        http-only: true
        secure: false # set true when using HTTPS

jwt:
  secret: ${JWT_SECRET:SchemeSathiSecretKeyForJwtTokenSigningMustBe256BitsLong!}
  expirationMs: ${JWT_EXPIRATION_MS:86400000}


